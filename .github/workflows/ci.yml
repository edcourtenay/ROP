name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore ROP.sln

      - name: Build
        run: dotnet build ROP.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ROP.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/ROP/ROP.csproj --configuration Release --no-build --output ./artifacts

      - name: Verify the analyzer is packaged
        run: |
          if ! unzip -l artifacts/*.nupkg | grep -q "analyzers/dotnet/cs/"; then
            echo "::error::The analyzer is missing from the package"
            exit 1
          fi
